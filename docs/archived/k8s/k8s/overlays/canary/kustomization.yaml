apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iam-platform-canary
namePrefix: canary-

resources:
  - ../../base
  - namespace.yaml

images:
  - name: iam-platform-service
    newTag: 1.0.0-SNAPSHOT-canary

patches:
  - target:
      kind: ConfigMap
      name: iam-platform-config
    patch: |
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: canary
  - target:
      kind: Deployment
      name: iam-platform-service
    patch: |
      - op: add
        path: /spec/template/metadata/labels/canary
        value: "true"
