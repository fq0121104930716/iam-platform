version: '3.8'

services:
  # Nacos - Service Registry
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: iam-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - iam-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/cs/ops/website"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Database
  postgres:
    image: postgres:16-alpine
    container_name: iam-postgres
    environment:
      - POSTGRES_DB=sso_oidc
      - POSTGRES_USER=dev_default
      - POSTGRES_PASSWORD=pwd123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_default"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache, Session, Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: iam-redis
    command: redis-server --requirepass iam59!z$
    ports:
      - "6379:6379"
    networks:
      - iam-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "iam59!z$", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zipkin - Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: iam-zipkin
    ports:
      - "9411:9411"
    networks:
      - iam-network

  # IAM Gateway - API Gateway
  iam-gateway:
    build:
      context: ./iam-gateway
      dockerfile: ../Dockerfile
    container_name: iam-gateway
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=iam-platform-dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - GATEWAY_CLIENT_SECRET=gateway-secret
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iam-network

  # IAM Auth Service - OAuth2/OIDC Provider
  iam-auth-service:
    build:
      context: ./iam-auth-server
      dockerfile: ../Dockerfile
    container_name: iam-auth-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=iam-platform-dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sso_oidc
      - DB_USERNAME=dev_default
      - DB_PASSWORD=pwd123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - ENCRYPTION_KEY=oLEwJBQg7EXXZijxJtoXYet4qcxODrqs
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iam-network

  # IAM Admin Service - Management Server
  iam-admin-service:
    build:
      context: ./iam-admin-server
      dockerfile: ../Dockerfile
    container_name: iam-admin-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=iam-platform-dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sso_oidc
      - DB_USERNAME=dev_default
      - DB_PASSWORD=pwd123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - ENCRYPTION_KEY=oLEwJBQg7EXXZijxJtoXYet4qcxODrqs
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "9002:9002"
      - "9003:9003"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iam-network

volumes:
  postgres-data:

networks:
  iam-network:
    driver: bridge
