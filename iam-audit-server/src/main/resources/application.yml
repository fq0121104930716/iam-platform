server:
  port: 9003
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:file:${user.dir}/ssl/keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: mycert

spring:
  application:
    name: iam-audit-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sso_oidc}
    username: ${DB_USERNAME:dev_default}
    password: ${DB_PASSWORD:pwd123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  consumer:
    group: audit-server-consumer-group

# Audit server specific config
audit:
  encryption:
    key: ${ENCRYPTION_KEY:}
    sensitive-fields:
      - requestParams
      - username
  alert:
    evaluation-interval-ms: 1000
    notification:
      email:
        enabled: ${ALERT_EMAIL_ENABLED:false}
        to: ${ALERT_EMAIL_TO:admin@example.com}
      webhook:
        enabled: ${ALERT_WEBHOOK_ENABLED:false}
        url: ${ALERT_WEBHOOK_URL:}
  siem:
    export-interval-seconds: 30
    batch-size: 100
  compliance:
    report-storage-path: ${REPORT_STORAGE_PATH:/tmp/audit-reports}

management:
  server:
    port: 9004
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://host.docker.internal:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    iam.platform.audit: INFO
    org.apache.rocketmq: INFO
