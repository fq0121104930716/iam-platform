apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iam-platform-test
namePrefix: test-

resources:
  - ../../base
  - namespace.yaml

images:
  - name: iam-platform-service
    newTag: 1.0.0-SNAPSHOT-test

patches:
  - target:
      kind: ConfigMap
      name: iam-platform-config
    patch: |
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: test
