<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SSO OIDC</title>
    <link rel="stylesheet" th:href="@{/bff/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Create Account</h1>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form th:action="@{/bff/register}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="nickname">Nickname (optional)</label>
                    <input type="text" id="nickname" name="nickname" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8">
                    <small>At least 8 characters, with uppercase, lowercase, and digit</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div class="footer">
                <p>Already have an account? <a th:href="@{/bff/login}">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            var pw = document.getElementById('password').value;
            var cpw = document.getElementById('confirmPassword').value;
            if (pw !== cpw) {
                e.preventDefault();
                alert('Passwords do not match!');
            }
        });
    </script>
</body>
</html>
