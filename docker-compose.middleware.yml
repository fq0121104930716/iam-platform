volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  nacos-data:
    driver: local
  # rocketmq-namesrv-logs:
  #   driver: local
  # rocketmq-broker-conf:
  #   driver: local
  # rocketmq-broker-logs:
  #   driver: local
  # rocketmq-broker-store:
  #   driver: local

services:
  # ============================================
  # 基础中间件层
  # ============================================

  # PostgreSQL - Database
  postgres:
    image: dhi.io/postgres:18-alpine3.23-dev
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=STPass123!
      - POSTGRES_DB=iam_platform
      - PGDATA=/var/lib/postgresql/18/data
    ports:
      - "5432:5432"
    volumes:
      # - F:\linux\docker\postgres\data:/var/lib/postgresql/18/data
      - postgres-data:/var/lib/postgresql/18/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Session Store
  redis:
    image: redis:8.6
    container_name: redis
    command: redis-server --requirepass "iam59!z$" --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "iam59!z$", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - Metrics Monitoring (可选)
  prometheus:
    image: ubuntu/prometheus:3.11-24.04_stable
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - F:\linux\docker\prometheus\prometheus.yml:/etc/prometheus/prometheus.yml
      - F:\linux\docker\prometheus\data:/prometheus
    restart: unless-stopped

  # ============================================
  # 消息队列层
  # ============================================

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -Xmn128m
    volumes:
      - F:\linux\docker\rocketmq\namesrv-logs:/home/rocketmq/logs
      # - rocketmq-namesrv-logs:/home/rocketmq/logs
    restart: unless-stopped

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: rocketmq-broker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -Xmn128m
    volumes:
      - F:\linux\docker\rocketmq\broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf
      - F:\linux\docker\rocketmq\broker-logs:/home/rocketmq/logs
      - F:\linux\docker\rocketmq\broker-store:/home/rocketmq/store
      # - rocketmq-broker-conf:/home/rocketmq/rocketmq-5.3.1/conf
      # - rocketmq-broker-logs:/home/rocketmq/logs
      # - rocketmq-broker-store:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
    restart: unless-stopped

  # RocketMQ Dashboard (可选管理界面)
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: rocketmq-dashboard
    ports:
      - "8088:8080"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=host.docker.internal:9876 -Dcom.rocketmq.sendMessageWithVIP=false
    depends_on:
      - rocketmq-namesrv
    restart: unless-stopped

  # ============================================
  # 服务治理层
  # ============================================

  # Nacos - Service Registry & Config Center
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=ip
      - NACOS_USER=nacos
      - JVM_XMS=1g
      - JVM_XMX=1g
      - JVM_XMN=512m
      - JVM_MS=128m
      - JVM_MMS=320m
      - TIME_ZONE=Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://host.docker.internal:8848/nacos/v1/console/server/state" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Zipkin - Distributed Tracing (可选)
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9410:9410"
      - "9411:9411"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://host.docker.internal:9411/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
