server:
  port: 9001
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:file:${user.dir}/ssl/keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: mycert

spring:
  application:
    name: iam-auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:host.docker.internal}:${DB_PORT:5432}/${DB_NAME:iam_platform}
    username: ${DB_USERNAME:dev_default}
    password: ${DB_PASSWORD:pwd123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:iam59!z$}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: true
  session:
    store-type: redis
    redis:
      namespace: sso-auth
  security:
    oauth2:
      client:
        registration:
          dingtalk:
            client-id: ${DINGTALK_CLIENT_ID:}
            client-secret: ${DINGTALK_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
            client-name: DingTalk
        provider:
          dingtalk:
            authorization-uri: https://login.dingtalk.com/oauth2/auth
            token-uri: https://api.dingtalk.com/v1.0/oauth2/userAccessToken
            user-info-uri: https://api.dingtalk.com/v1.0/contact/users/me
            user-name-attribute: unionId

# Security - JWK & encryption settings (independent namespace to avoid Spring Security binding conflicts)
security:
  jwk:
    rsa:
      private-key-location: ${JWK_RSA_PRIVATE_KEY:classpath:keys/private.pem}
      public-key-location: ${JWK_RSA_PUBLIC_KEY:classpath:keys/public.pem}
  encryption:
    key: ${ENCRYPTION_KEY:}
  issuer-uri: ${OIDC_ISSUER_URI:https://localhost:9001}

# RocketMQ configuration
# NOTE: host.docker.internal only works on Docker Desktop (Windows/macOS).
# For Linux native Docker, use --add-host=host.docker.internal:host-gateway or actual host IP.
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:host.docker.internal:9876}
  producer:
    group: iam-auth-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# Audit configuration
audit:
  rocketmq:
    enabled: ${AUDIT_ROCKETMQ_ENABLED:true}

# Verification code login configuration
verification-code:
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:}
  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:noreply@iam-platform.com}

# Security policy configuration
sso:
  security:
    rate-limit:
      enabled: true
      max-attempts: 5
      window-seconds: 300
    account-lockout:
      enabled: true
      threshold: 10
      lockout-duration-minutes: 30
    ip-whitelist: []
    ip-blacklist: []
  
  # LDAP configuration
  ldap:
    enabled: ${LDAP_ENABLED:false}
    urls: ${LDAP_URLS:ldap://ad.example.com:389}
    base-dn: ${LDAP_BASE_DN:DC=example,DC=com}
    bind-dn: ${LDAP_BIND_DN:CN=sso-service,OU=ServiceAccounts,DC=example,DC=com}
    bind-password: ${LDAP_BIND_PASSWORD:}
    user-search-base: ${LDAP_USER_SEARCH_BASE:OU=Users}
    user-search-filter: ${LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
    use-ssl: ${LDAP_USE_SSL:false}

  # CAS (Central Authentication Service) configuration
  cas:
    server-url: ${CAS_SERVER_URL:https://localhost:9001/cas}
    ticket-validity-seconds: ${CAS_TICKET_VALIDITY:600}
    ticket-prefix: ${CAS_TICKET_PREFIX:ST}
    single-sign-out-enabled: ${CAS_SLO_ENABLED:true}
    logout-url: ${CAS_LOGOUT_URL:https://localhost:9001/cas/logout}
    login-url: ${CAS_LOGIN_URL:https://localhost:9001/cas/login}
    front-channel-logout-enabled: ${CAS_FRONT_CHANNEL_LOGOUT:true}
    back-channel-logout-enabled: ${CAS_BACK_CHANNEL_LOGOUT:true}
    logout-request-ttl-seconds: ${CAS_LOGOUT_TTL:300}
    send-logout-to-all-services: ${CAS_LOGOUT_ALL_SERVICES:true}

  # SAML 2.0 IdP configuration
  saml:
    entity-id: ${SAML_ENTITY_ID:https://localhost:9001/saml/metadata}
    sso-url: ${SAML_SSO_URL:https://localhost:9001/saml/sso}
    assertion-validity-minutes: ${SAML_ASSERTION_VALIDITY:5}
    signature-algorithm: ${SAML_SIGNATURE_ALGO:http://www.w3.org/2001/04/xmldsig-more#rsa-sha256}
    name-id-format: ${SAML_NAME_ID_FORMAT:urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress}
    sign-assertions: ${SAML_SIGN_ASSERTIONS:true}
    signing-key-path: ${SAML_SIGNING_KEY_PATH:file:${user.dir}/ssl/keystore.p12}
    signing-key-password: ${SAML_SIGNING_KEY_PASSWORD:changeit}

management:
  server:
    port: 9005
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://host.docker.internal:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0
