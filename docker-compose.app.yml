services:
  # ============================================
  # 业务服务层
  # ============================================

  # IAM Auth Server - Authentication & Authorization
  iam-auth-server:
    build:
      context: .
      dockerfile: iam-auth-server/Dockerfile
    container_name: iam-auth-server
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - NACOS_ADDR=host.docker.internal:8848
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=iam_platform
      - DB_USERNAME=postgres
      - DB_PASSWORD=STPass123!
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - ROCKETMQ_NAMESRV=host.docker.internal:9876
      - ENCRYPTION_KEY=changeme-changeme-changeme-changeme!!
    ports:
      - "9001:9001"
      - "9005:9005"
    restart: unless-stopped

  # IAM Admin Server - User & Permission Management
  iam-admin-server:
    build:
      context: .
      dockerfile: iam-admin-server/Dockerfile
    container_name: iam-admin-server
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - NACOS_ADDR=host.docker.internal:8848
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=iam_platform
      - DB_USERNAME=postgres
      - DB_PASSWORD=STPass123!
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - ROCKETMQ_NAMESRV=host.docker.internal:9876
      - ENCRYPTION_KEY=changeme-changeme-changeme-changeme!!
    ports:
      - "9002:9002"
      - "9006:9006"
    restart: unless-stopped

  # IAM Audit Server - Centralized Audit Log Management
  iam-audit-server:
    build:
      context: .
      dockerfile: iam-audit-server/Dockerfile
    container_name: iam-audit-server
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - NACOS_ADDR=host.docker.internal:8848
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=iam_platform
      - DB_USERNAME=postgres
      - DB_PASSWORD=STPass123!
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - ROCKETMQ_NAMESRV=host.docker.internal:9876
      - ENCRYPTION_KEY=changeme-changeme-changeme-changeme!!
    ports:
      - "9003:9003"
      - "9004:9004"
    restart: unless-stopped

  # ============================================
  # 聚合层
  # ============================================

  # IAM BFF Server - Backend for Frontend
  iam-bff-service:
    build:
      context: .
      dockerfile: iam-bff-server/Dockerfile
    container_name: iam-bff-server
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - NACOS_ADDR=host.docker.internal:8848
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - AUTH_SERVER_URL=http://host.docker.internal:9001
      - ADMIN_SERVER_URL=http://host.docker.internal:9002
    ports:
      - "9010:9010"
    restart: unless-stopped

  # IAM Gateway - API Gateway
  iam-gateway:
    build:
      context: .
      dockerfile: iam-gateway/Dockerfile
    container_name: iam-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - NACOS_ADDR=host.docker.internal:8848
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=iam59!z$
      - AUTH_SERVER_URL=http://host.docker.internal:9001
      - ADMIN_SERVER_URL=http://host.docker.internal:9002
      - BFF_SERVER_URL=http://host.docker.internal:9010
      - AUDIT_SERVER_URL=http://host.docker.internal:9003
    ports:
      - "9000:9000"
    restart: unless-stopped
