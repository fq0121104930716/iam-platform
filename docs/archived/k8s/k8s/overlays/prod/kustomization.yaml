apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iam-platform-prod

resources:
  - ../../base
  - namespace.yaml

images:
  - name: iam-platform-service
    newTag: 1.0.0

patches:
  - target:
      kind: ConfigMap
      name: iam-platform-config
    patch: |
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: prod
      - op: replace
        path: /data/DB_HOST
        value: postgres-iam-platform-prod
      - op: replace
        path: /data/REDIS_HOST
        value: redis-iam-platform-prod
      - op: replace
        path: /data/OIDC_ISSUER_URI
        value: https://sso.example.com
  - target:
      kind: Deployment
      name: iam-platform-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
