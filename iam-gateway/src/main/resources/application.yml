server:
  port: 9000
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:file:${user.dir}/ssl/keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: mycert

spring:
  application:
    name: iam-gateway

  security:
    oauth2:
      client:
        registration:
          gateway-sso:
            client-id: iam-gateway
            client-secret: ${GATEWAY_CLIENT_SECRET:gateway-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          gateway-sso:
            # 显式声明端点，避免启动时通过 issuer-uri 拉取 OIDC Discovery（消除对 auth 服务的启动依赖）
            authorization-uri: ${AUTH_SERVER_URL:http://localhost:9001}/oauth2/authorize
            token-uri: ${AUTH_SERVER_URL:http://localhost:9001}/oauth2/token
            user-info-uri: ${AUTH_SERVER_URL:http://localhost:9001}/userinfo
            jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:9001}/oauth2/jwks
      # Resource Server 配置 - jwk-set-uri 懒加载，首次验证 JWT 时才拉取 JWKS
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:9001}/oauth2/jwks

  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:iam59!z$}

management:
  server:
    port: 9080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://host.docker.internal:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    iam.platform.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
