<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SSO OIDC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-method {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-method.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-group .input-with-btn {
            display: flex;
            gap: 8px;
        }

        .form-group .input-with-btn input {
            flex: 1;
        }

        .form-group .input-with-btn button {
            white-space: nowrap;
            padding: 8px 12px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        .btn:hover {
            background: #0056b3;
        }

        .btn-dingtalk {
            display: block;
            width: 100%;
            padding: 10px;
            background: #0089FF;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
        }

        .send-code-btn {
            padding: 8px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .send-code-btn:hover {
            background: #218838;
        }

        .send-code-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>SSO Login</h1>

            <div th:if="${param.error}" class="alert alert-error">
                Invalid credentials or authentication failed.
            </div>

            <div th:if="${param.registered}" class="alert alert-success">
                Registration successful. Please login.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>

            <!-- Login method tabs -->
            <div class="login-methods">
                <button type="button" class="btn-method active" data-method="password">Password</button>
                <button type="button" class="btn-method" data-method="verification-code">Verification Code</button>
                <button type="button" class="btn-method" data-method="oauth2">Social Login</button>
            </div>

            <!-- Unified login form (all first-party methods POST to /login) -->
            <form th:action="@{/login}" method="post" id="login-form">
                <input type="hidden" name="method" id="auth-method" value="password">

                <!-- Password fields -->
                <div id="password-fields" class="form-section active">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>
                </div>

                <!-- SMS fields -->
                <div id="sms-fields" class="form-section">
                    <div class="form-group">
                        <label for="sms-phone">Phone Number</label>
                        <div class="input-with-btn">
                            <input type="text" id="sms-phone" name="phone" placeholder="Enter your phone number">
                            <button type="button" class="send-code-btn" id="send-sms-btn">Send Code</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="sms-code">Verification Code</label>
                        <input type="text" id="sms-code" name="code" maxlength="6" placeholder="Enter 6-digit code">
                    </div>
                </div>

                <!-- Email fields -->
                <div id="email-fields" class="form-section">
                    <div class="form-group">
                        <label for="email-addr">Email Address</label>
                        <div class="input-with-btn">
                            <input type="email" id="email-addr" name="email" placeholder="Enter your email">
                            <button type="button" class="send-code-btn" id="send-email-btn">Send Code</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email-code">Verification Code</label>
                        <input type="text" id="email-code" name="code" maxlength="6" placeholder="Enter 6-digit code">
                    </div>
                </div>

                <!-- Submit button (hidden for OAuth2 tab) -->
                <button type="submit" class="btn" id="login-submit-btn">Login</button>
            </form>

            <!-- OAuth2 social login (separate links, not form) -->
            <div id="oauth2-section" class="form-section">
                <a th:href="@{/oauth2/authorization/dingtalk}" class="btn-dingtalk">
                    Login with DingTalk
                </a>
                <!-- Add more social login buttons here as needed -->
            </div>

            <div class="footer">
                <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const authMethodField = document.getElementById('auth-method');
        const submitBtn = document.getElementById('login-submit-btn');

        // Switch login methods
        document.querySelectorAll('.btn-method').forEach(btn => {
            btn.addEventListener('click', function () {
                const method = this.dataset.method;

                // Update active tab
                document.querySelectorAll('.btn-method').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Show corresponding section
                document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

                if (method === 'password') {
                    document.getElementById('password-fields').classList.add('active');
                    authMethodField.value = 'password';
                    submitBtn.style.display = 'block';
                    loginForm.style.display = 'block';
                } else if (method === 'verification-code') {
                    // Default to email for verification code
                    document.getElementById('email-fields').classList.add('active');
                    authMethodField.value = 'email';
                    submitBtn.style.display = 'block';
                    loginForm.style.display = 'block';
                } else if (method === 'oauth2') {
                    document.getElementById('oauth2-section').classList.add('active');
                    submitBtn.style.display = 'none';
                    loginForm.style.display = 'none';
                }
            });
        });

        // Toggle between email and SMS in verification code mode
        const vcTypeField = document.createElement('input');
        vcTypeField.type = 'hidden';
        vcTypeField.id = 'vc-type';
        vcTypeField.value = 'email';
        loginForm.appendChild(vcTypeField);

        // Send SMS code
        document.getElementById('send-sms-btn').addEventListener('click', function () {
            const phone = document.getElementById('sms-phone').value;
            if (!phone) {
                alert('Please enter your phone number');
                return;
            }
            sendCodeRequest('sms', phone, this);
        });

        // Send email code
        document.getElementById('send-email-btn').addEventListener('click', function () {
            const email = document.getElementById('email-addr').value;
            if (!email) {
                alert('Please enter your email address');
                return;
            }
            sendCodeRequest('email', email, this);
        });

        function sendCodeRequest(type, identifier, btn) {
            const paramName = type === 'sms' ? 'phone' : 'email';
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Sending...';

            fetch(`/auth/code/${type}?${paramName}=${encodeURIComponent(identifier)}`, {
                method: 'POST'
            })
                .then(response => {
                    if (response.ok) {
                        alert('Verification code sent! Check the logs for the code (dev mode).');
                        // Start countdown to re-enable
                        let seconds = 60;
                        btn.textContent = `${seconds}s`;
                        const timer = setInterval(() => {
                            seconds--;
                            btn.textContent = `${seconds}s`;
                            if (seconds <= 0) {
                                clearInterval(timer);
                                btn.disabled = false;
                                btn.textContent = originalText;
                            }
                        }, 1000);
                    } else {
                        alert('Failed to send verification code.');
                        btn.disabled = false;
                        btn.textContent = originalText;
                    }
                })
                .catch(err => {
                    alert('Failed to send verification code.');
                    btn.disabled = false;
                    btn.textContent = originalText;
                });
        }

        // Handle verification code type toggle (email vs sms)
        // When switching between email and SMS fields, update the method hidden field
        function updateVerificationCodeMethod(isSms) {
            if (isSms) {
                authMethodField.value = 'sms';
            } else {
                authMethodField.value = 'email';
            }
        }

        // Add listeners to detect when email or phone fields get focus
        document.getElementById('email-addr').addEventListener('focus', () => updateVerificationCodeMethod(false));
        document.getElementById('sms-phone').addEventListener('focus', () => updateVerificationCodeMethod(true));
    </script>
</body>

</html>
