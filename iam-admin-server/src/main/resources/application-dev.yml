spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: false

security:
  encryption:
    key: ${ENCRYPTION_KEY:oLEwJBQg7EXXZijxJtoXYet4qcxODrqs}

logging:
  level:
    root: INFO
    iam.platform.admin: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
