spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:host.docker.internal:8848}
        namespace: ${NACOS_NAMESPACE:iam-platform-dev}
        group: DEFAULT_GROUP
        metadata:
          management.context-path: /actuator
    gateway:
      discovery:
        locator:
          enabled: false  # 不自动创建路由,使用手动配置
      routes:
        # BFF服务路由 - 优先匹配
        - id: bff-service
          uri: lb://iam-bff-service
          predicates:
            - Path=/bff/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1

        # 前端静态资源路由 - admin-ui
        - id: admin-ui-static
          uri: lb://iam-bff-service
          predicates:
            - Path=/admin-ui/**
          filters:
            - StripPrefix=0

        # 根路径重定向到admin-ui
        - id: admin-ui-index
          uri: lb://iam-bff-service
          predicates:
            - Path=/

        # 认证服务路由 - 基于路径
        - id: auth-service-path
          uri: lb://iam-auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1

        # 管理服务路由 - 基于路径
        - id: admin-service-path
          uri: lb://iam-admin-service
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # 认证服务路由 - 基于域名
        - id: auth-service-domain
          uri: lb://iam-auth-service
          predicates:
            - Host=auth.iam.local,auth.iam.local:**

        # 管理服务路由 - 基于域名
        - id: admin-service-domain
          uri: lb://iam-admin-service
          predicates:
            - Host=admin.iam.local,admin.iam.local:**

      # 全局跨域配置
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
