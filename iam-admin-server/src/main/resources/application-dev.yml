# ============================================================
# IAM Admin Server - Development Environment Configuration
# ============================================================

# JPA/Hibernate dev settings
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Thymeleaf dev settings
  thymeleaf:
    cache: false

# Security dev settings
security:
  encryption:
    key: ${ENCRYPTION_KEY:oLEwJBQg7EXXZijxJtoXYet4qcxODrqs}

# Logging dev settings
logging:
  level:
    root: INFO
    iam.platform.admin: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# SpringDoc dev settings
springdoc:
  swagger-ui:
    enabled: true
